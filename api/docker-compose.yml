services:
  blitzyxsc-plus:
    build: .
    container_name: blitzyxsc-plus
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - HOST=0.0.0.0
      - RATE_LIMIT_PER_MIN=60
      # - BLITZ_PROVIDERS=fxtwitter,syndication,graphql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
